<script>
    const calls = new Map();
    const tableBody = document.getElementById('callsTableBody');
    const emptyRow = document.getElementById('emptyRow');
    const connectionBadge = document.getElementById('connectionBadge');
    const expandedRows = new Set();
    const terminatingCalls = new Set();
    let currentFilter = 'all';
    let activeTranscriptCallId = null;

    // WebSocket Auto-Reconnect Variables
    let ws;
    let reconnectTimeout;

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        connectionBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
        connectionBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Connected';
        clearTimeout(reconnectTimeout);
      };

      ws.onclose = () => {
        connectionBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20';
        connectionBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Reconnecting...';
        
        // Attempt to reconnect every 3 seconds
        clearTimeout(reconnectTimeout);
        reconnectTimeout = setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = (err) => {
        ws.close(); // Force the onclose handler to trigger a reconnect
      };

      ws.onmessage = (event) => {
        const { event: evtType, data } = JSON.parse(event.data);
        if (evtType === 'INIT_STATE') {
          calls.clear();
          data.forEach(call => calls.set(call.id, call));
        } else if (evtType === 'CALL_UPDATED') {
          calls.set(data.id, data);
          if (terminatingCalls.has(data.id) && data.status === 'ended') {
            terminatingCalls.delete(data.id);
          }
          if (activeTranscriptCallId === data.id) {
            renderTranscriptFeed(data);
          }
        } else if (evtType === 'TRANSCRIPT_UPDATE') {
          const c = calls.get(data.callId);
          if (c) {
            c.transcript = c.transcript || [];
            c.transcript.push(data.segment);
            if (activeTranscriptCallId === data.callId) {
              renderTranscriptFeed(c);
            }
          }
        }
        render();
      };
    }

    // Initialize the first connection
    connectWebSocket();

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'live', 'past'].forEach(f => {
        const btn = document.getElementById('btnFilter' + f.charAt(0).toUpperCase() + f.slice(1));
        if (f === filter) {
          btn.className = 'px-3 py-1.5 rounded-md bg-indigo-600 text-white font-medium transition';
        } else {
          btn.className = 'px-3 py-1.5 rounded-md text-slate-400 hover:text-white transition';
        }
      });
      render();
    }

    async function triggerSync() {
      const icon = document.getElementById('syncIcon');
      icon.classList.add('animate-spin');
      try {
        await fetch('/api/sync-history');
      } finally {
        icon.classList.remove('animate-spin');
      }
    }

    async function endCall(callId, event) {
      event.stopPropagation();
      if (!confirm('Are you sure you want to terminate this live call?')) return;

      terminatingCalls.add(callId);
      render();

      try {
        const res = await fetch(`/api/calls/${callId}/end`, { method: 'POST' });
        if (!res.ok) {
          const err = await res.json();
          alert('Failed to end call: ' + (err.error || 'Server error'));
          terminatingCalls.delete(callId);
          render();
        }
      } catch (e) {
        alert('Network error while terminating call');
        terminatingCalls.delete(callId);
        render();
      }
    }

    function toggleRow(callId) {
      if (expandedRows.has(callId)) {
        expandedRows.delete(callId);
      } else {
        expandedRows.add(callId);
      }
      render();
    }

    // Transcript Slide-over Drawer Logic
    function openTranscript(callId, event) {
      if (event) event.stopPropagation();
      activeTranscriptCallId = callId;
      const call = calls.get(callId);
      if (!call) return;

      const isLive = ['in-progress', 'ringing', 'queued'].includes(call.status);
      document.getElementById('drawerLiveBadge').style.display = isLive ? 'inline-flex' : 'none';
      document.getElementById('drawerTitle').textContent = `${call.structuredOutputs?.brand || 'Carrier'} Transcript`;
      document.getElementById('drawerSubtitle').textContent = `Target: ${call.customerNumber} (${call.status})`;

      renderTranscriptFeed(call);
      document.getElementById('transcriptDrawer').classList.remove('hidden');
    }

    function closeTranscriptDrawer() {
      activeTranscriptCallId = null;
      document.getElementById('transcriptDrawer').classList.add('hidden');
    }

    function renderTranscriptFeed(call) {
      const feed = document.getElementById('transcriptFeed');
      const segments = call.transcript || [];
      document.getElementById('drawerStats').textContent = `${segments.length} message segment${segments.length === 1 ? '' : 's'}`;

      if (segments.length === 0) {
        feed.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <svg class="w-8 h-8 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
            No speech transcribed yet.<br><span class="text-[11px] text-slate-600">Audio will appear here as both sides speak.</span>
          </div>`;
        return;
      }

      feed.innerHTML = segments.map(seg => {
        const isAssistant = seg.role === 'assistant' || seg.role === 'bot';
        const isSystem = seg.role === 'system';

        if (isSystem) {
          return `
            <div class="bg-slate-800/40 border border-slate-700/50 p-3 rounded-lg text-slate-300 font-mono text-[11px] whitespace-pre-wrap leading-relaxed">
              ${seg.text}
            </div>
          `;
        }

        const roleName = isAssistant ? (call.structuredOutputs?.brand || 'Agent / IVR') : 'Scout Bot';
        const bgBubble = isAssistant ? 'bg-slate-800/90 text-slate-200 border border-slate-700/70' : 'bg-indigo-600/20 text-indigo-200 border border-indigo-500/30';
        const align = isAssistant ? 'items-start mr-8' : 'items-end ml-8';
        const textMuted = isAssistant ? 'text-indigo-400' : 'text-slate-400';

        return `
          <div class="flex flex-col ${align} space-y-1">
            <span class="text-[10px] uppercase font-semibold ${textMuted} tracking-wider px-1">${roleName}</span>
            <div class="p-3 rounded-2xl ${bgBubble} leading-relaxed max-w-full break-words">
              ${seg.text}
            </div>
          </div>
        `;
      }).join('');

      feed.scrollTop = feed.scrollHeight;
    }

    function copyTranscript() {
      if (!activeTranscriptCallId) return;
      const call = calls.get(activeTranscriptCallId);
      if (!call || !call.transcript) return;

      const text = call.transcript.map(s => `[${s.role.toUpperCase()}]: ${s.text}`).join('\n\n');
      navigator.clipboard.writeText(text).then(() => alert('Transcript copied to clipboard!'));
    }

    function render() {
      const callList = Array.from(calls.values()).sort(
        (a, b) => new Date(b.startedAt) - new Date(a.startedAt)
      );

      const liveCalls = callList.filter(c => ['in-progress', 'ringing', 'queued'].includes(c.status));
      const pastCalls = callList.filter(c => !['in-progress', 'ringing', 'queued'].includes(c.status));

      document.getElementById('countAll').textContent = callList.length;
      document.getElementById('countLive').textContent = liveCalls.length;
      document.getElementById('countPast').textContent = pastCalls.length;

      let filtered = callList;
      if (currentFilter === 'live') filtered = liveCalls;
      if (currentFilter === 'past') filtered = pastCalls;

      if (filtered.length === 0) {
        tableBody.innerHTML = '';
        tableBody.appendChild(emptyRow);
        return;
      }

      tableBody.innerHTML = '';
      filtered.forEach((call) => {
        const isExpanded = expandedRows.has(call.id);
        const isLive = ['in-progress', 'ringing', 'queued'].includes(call.status);
        const isTerminating = terminatingCalls.has(call.id);
        
        const durationSec = Math.max(0, Math.floor(((call.endedAt ? new Date(call.endedAt) : new Date()) - new Date(call.startedAt).getTime()) / 1000));
        const durationStr = `${String(Math.floor(durationSec / 60)).padStart(2, '0')}:${String(durationSec % 60).padStart(2, '0')}`;
        const timeDisplay = isLive ? durationStr : `${new Date(call.startedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} (${durationStr})`;

        const statusBadge = isLive
          ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
               <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> ${call.status}
             </span>`
          : `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-slate-400 border border-slate-700/60">
               ${call.status}
             </span>`;

        const s = call.structuredOutputs || {};

        const mainRow = document.createElement('tr');
        mainRow.className = `transition-colors font-mono ${isExpanded ? 'bg-slate-800/30' : 'hover:bg-slate-800/20'}`;
        mainRow.innerHTML = `
          <td class="py-3.5 px-4">${statusBadge}</td>
          <td class="py-3.5 px-4 font-sans">
            ${s.brand && s.brand !== '—' ? `
              <span class="inline-block px-2.5 py-0.5 rounded bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 font-semibold text-[11px]">
                ${s.brand}
              </span>
            ` : '<span class="text-slate-600 font-sans">—</span>'}
          </td>
          <td class="py-3.5 px-4 text-slate-200 font-sans font-medium">${call.customerNumber}</td>
          <td class="py-3.5 px-4 text-cyan-400 font-semibold font-sans">${s.waitTimes && s.waitTimes !== '—' ? s.waitTimes : '<span class="text-slate-600">—</span>'}</td>
          <td class="py-3.5 px-4 text-amber-300 font-medium font-sans">${s.timeToAgent && s.timeToAgent !== '—' ? s.timeToAgent : '<span class="text-slate-600">—</span>'}</td>
          <td class="py-3.5 px-4 text-slate-400">${timeDisplay}</td>
          <td class="py-3.5 px-4 text-right">
            <div class="flex items-center justify-end gap-1.5">
              <button 
                onclick="openTranscript('${call.id}', event)" 
                class="font-sans px-2.5 py-1 rounded text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center gap-1"
                title="View Speech-to-Text Transcript">
                <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                <span class="hidden sm:inline">${isLive ? 'Live Text' : 'Transcript'}</span>
              </button>

              ${isLive ? `
                <button 
                  onclick="endCall('${call.id}', event)" 
                  ${isTerminating ? 'disabled' : ''}
                  class="font-sans px-2.5 py-1 rounded text-xs font-semibold bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 transition flex items-center gap-1 ${isTerminating ? 'opacity-50 cursor-not-allowed' : ''}">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"/></svg>
                  <span>End</span>
                </button>
              ` : ''}

              <button onclick="toggleRow('${call.id}')" class="font-sans px-2.5 py-1 bg-slate-800/80 hover:bg-slate-700 text-slate-200 rounded border border-slate-700/80 transition">
                ${isExpanded ? 'Hide ▲' : 'Inspect ▼'}
              </button>
            </div>
          </td>
        `;
        tableBody.appendChild(mainRow);

        if (isExpanded) {
          const detailRow = document.createElement('tr');
          detailRow.className = 'bg-slate-950/60 border-b border-slate-800/80';
          detailRow.innerHTML = `
            <td colspan="7" class="p-4 sm:p-5 font-sans">
              <div class="space-y-4">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                  <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-lg">
                    <span class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">Brand</span>
                    <div class="text-sm font-semibold text-indigo-300 mt-1">${s.brand || '—'}</div>
                  </div>
                  <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-lg">
                    <span class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">Reported Wait</span>
                    <div class="text-sm font-semibold text-cyan-400 mt-1">${s.waitTimes || '—'}</div>
                  </div>
                  <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-lg">
                    <span class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">Time to Agent</span>
                    <div class="text-sm font-semibold text-amber-300 mt-1">${s.timeToAgent || '—'}</div>
                  </div>
                  <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-lg">
                    <span class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">HOOPs</span>
                    <div class="text-sm font-medium text-slate-200 mt-1">${s.hoops && s.hoops.trim() ? s.hoops : 'None mentioned'}</div>
                  </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-lg flex flex-col justify-start">
                    <span class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">What Was The System Used</span>
                    <p class="text-xs font-normal text-slate-300 mt-2 leading-relaxed">${s.systemUsed || 'No system details logged.'}</p>
                  </div>
                  <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-lg flex flex-col justify-start">
                    <span class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">IVR VA Options / Path</span>
                    <p class="text-xs font-normal text-slate-300 mt-2 leading-relaxed">${s.ivrOptions || 'No path options logged.'}</p>
                  </div>
                </div>
                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-lg">
                  <span class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">Customer Experience to Agent</span>
                  <p class="text-xs font-normal text-slate-300 mt-1.5 leading-relaxed">${s.cxToAgent && s.cxToAgent.trim() ? s.cxToAgent : 'No customer experience observations recorded.'}</p>
                </div>
              </div>
            </td>
          `;
          tableBody.appendChild(detailRow);
        }
      });
    }

    setInterval(() => {
      const hasLive = Array.from(calls.values()).some(c => ['in-progress', 'ringing', 'queued'].includes(c.status));
      if (hasLive) render();
    }, 1000);
  </script>
