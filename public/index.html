<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vapi Live Call Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div class="max-w-6xl mx-auto p-6">
    <header class="flex justify-between items-center border-b border-slate-800 pb-5 mb-8">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Active Call Scout</h1>
        <p class="text-sm text-slate-400 mt-1">Real-time status monitoring via Vapi Webhooks</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="connectionBadge" class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connecting
        </span>
        <span class="text-xs bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-slate-400">
          Live Count: <strong id="callCount" class="text-emerald-400 font-mono">0</strong>
        </span>
      </div>
    </header>

    <main>
      <div class="overflow-x-auto bg-slate-900/60 rounded-xl border border-slate-800 shadow-xl">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-800/50 text-slate-400 uppercase tracking-wider text-xs border-b border-slate-800">
            <tr>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4">Call ID</th>
              <th class="py-3 px-4">Customer</th>
              <th class="py-3 px-4">Duration</th>
              <th class="py-3 px-4">Last Activity</th>
            </tr>
          </thead>
          <tbody id="callsTableBody" class="divide-y divide-slate-800 font-mono text-xs">
            <tr id="emptyRow">
              <td colspan="5" class="py-10 text-center font-sans text-slate-500">
                No active calls running at the moment.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const calls = new Map();
    const tableBody = document.getElementById('callsTableBody');
    const emptyRow = document.getElementById('emptyRow');
    const countBadge = document.getElementById('callCount');
    const connectionBadge = document.getElementById('connectionBadge');

    // Setup dynamic WebSocket connection
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}`);

    ws.onopen = () => {
      connectionBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
      connectionBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Connected';
    };

    ws.onclose = () => {
      connectionBadge.className = 'flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20';
      connectionBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400"></span> Disconnected';
    };

    ws.onmessage = (event) => {
      const { event: evtType, data } = JSON.parse(event.data);

      if (evtType === 'INIT_STATE') {
        calls.clear();
        data.forEach(call => calls.set(call.id, call));
      } else if (evtType === 'CALL_UPDATED') {
        calls.set(data.id, data);
      } else if (evtType === 'CALL_ENDED') {
        calls.delete(data.id);
      }

      render();
    };

    function render() {
      countBadge.textContent = calls.size;

      if (calls.size === 0) {
        tableBody.innerHTML = '';
        tableBody.appendChild(emptyRow);
        return;
      }

      tableBody.innerHTML = '';
      calls.forEach((call) => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/40 transition-colors';

        const duration = Math.max(0, Math.floor((Date.now() - new Date(call.startedAt).getTime()) / 1000));
        const minutes = String(Math.floor(duration / 60)).padStart(2, '0');
        const seconds = String(duration % 60).padStart(2, '0');

        row.innerHTML = `
          <td class="py-3 px-4">
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-sans font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
              ${call.status}
            </span>
          </td>
          <td class="py-3 px-4 text-slate-300">${call.id.slice(0, 8)}...</td>
          <td class="py-3 px-4 text-slate-200">${call.customerNumber}</td>
          <td class="py-3 px-4 text-amber-400">${minutes}:${seconds}</td>
          <td class="py-3 px-4 text-slate-400 font-sans text-xs">${new Date(call.updatedAt).toLocaleTimeString()}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Refresh duration timers every second
    setInterval(() => {
      if (calls.size > 0) render();
    }, 1000);
  </script>
</body>
</html>
